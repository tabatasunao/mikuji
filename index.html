<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>おみくじ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #fff;
            font-family: 'Hiragino Sans', 'Yu Gothic', sans-serif;
        }
        h1 {
            color: #cc0000;
            margin-bottom: 20px;
            font-size: 2.5rem;
        }
        #top-section {
            display: none;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
        }
        #top-section.visible {
            display: flex;
        }
        #roulette-container {
            position: relative;
            overflow: hidden;
            border: none;
            border-radius: 0;
            background: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 30px;
        }
        #roulette-image {
            display: block;
            max-width: 100%;
            height: auto;
            visibility: hidden;
        }
        #roulette-image.visible {
            visibility: visible;
        }
        #loading-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 50px;
            color: #000;
        }
        #loading-section.hidden {
            display: none;
        }
        #progress-bar {
            width: 300px;
            height: 20px;
            background: #ddd;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 15px;
        }
        #progress-fill {
            height: 100%;
            background: #cc0000;
            width: 0%;
            transition: width 0.1s;
        }
        #progress-text {
            margin-top: 10px;
            font-size: 1.2rem;
        }
        #message {
            margin-bottom: 15px;
            font-size: 1.5rem;
            color: #000;
            text-align: center;
        }
        #start-btn {
            margin-bottom: 0;
            padding: 15px 40px;
            font-size: 1.2rem;
            background: #cc0000;
            color: #fff;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        #start-btn:hover:not(:disabled) {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(204, 0, 0, 0.4);
        }
        #start-btn:disabled {
            background: #888;
            cursor: not-allowed;
        }
        .spinning #roulette-container {
            animation: glow 0.5s ease-in-out infinite alternate;
        }
        @keyframes glow {
            from { box-shadow: 0 0 10px #cc0000; }
            to { box-shadow: 0 0 30px #cc0000; }
        }
    </style>
</head>
<body>
    <h1>おみくじ</h1>
    <div id="top-section">
        <p id="message">読み込み中...</p>
        <button id="start-btn" disabled>スタート</button>
    </div>
    <div id="loading-section">
        <div>読み込み中...</div>
        <div id="progress-bar">
            <div id="progress-fill"></div>
        </div>
        <div id="progress-text">0 / 480</div>
    </div>
    <div id="roulette-container">
        <img id="roulette-image" src="" alt="おみくじ">
    </div>

    <script>
        const totalImages = 480;
        const imageFolder = 'complete_small/';
        const images = [];
        let loadedCount = 0;

        const rouletteImage = document.getElementById('roulette-image');
        const startBtn = document.getElementById('start-btn');
        const message = document.getElementById('message');
        const container = document.getElementById('roulette-container');
        const loadingSection = document.getElementById('loading-section');
        const topSection = document.getElementById('top-section');
        const progressFill = document.getElementById('progress-fill');
        const progressText = document.getElementById('progress-text');

        let isSpinning = false;
        let intervalId = null;
        let currentIndex = 0;

        // Preload all images
        let processedCount = 0;
        for (let i = 1; i <= totalImages; i++) {
            const img = new Image();
            img.onload = () => {
                loadedCount++;
                processedCount++;
                progressFill.style.width = (processedCount / totalImages * 100) + '%';
                progressText.textContent = `${processedCount} / ${totalImages}`;

                if (processedCount === totalImages) {
                    loadingSection.classList.add('hidden');
                    topSection.classList.add('visible');
                    startBtn.disabled = false;
                    message.textContent = 'ボタンを押してスタート！';
                }
            };
            img.onerror = () => {
                processedCount++;
                progressFill.style.width = (processedCount / totalImages * 100) + '%';
                progressText.textContent = `${processedCount} / ${totalImages}`;

                if (processedCount === totalImages) {
                    loadingSection.classList.add('hidden');
                    topSection.classList.add('visible');
                    startBtn.disabled = false;
                    message.textContent = 'ボタンを押してスタート！';
                }
            };
            img.src = `${imageFolder}combined_${i}.jpg`;
            images.push(img);
        }

        function spin() {
            currentIndex = Math.floor(Math.random() * totalImages);
            rouletteImage.src = images[currentIndex].src;
        }

        function startSpin() {
            if (isSpinning) {
                // Stop
                clearInterval(intervalId);
                isSpinning = false;
                document.body.classList.remove('spinning');
                startBtn.textContent = 'もう一度';
                message.textContent = '結果が出ました！';
            } else {
                // Start
                isSpinning = true;
                rouletteImage.classList.add('visible');
                document.body.classList.add('spinning');
                startBtn.textContent = 'ストップ';
                message.textContent = 'クリックして止めてね！';
                intervalId = setInterval(spin, 50);
            }
        }

        startBtn.addEventListener('click', startSpin);
        container.addEventListener('click', () => {
            if (isSpinning) startSpin();
        });
    </script>
</body>
</html>
